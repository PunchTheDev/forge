name: Test

on:
  pull_request:
    paths-ignore:
      - "agents/**"
  push:
    branches: [main]
    paths-ignore:
      - "agents/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e . pytest

      - name: Run unit tests
        # OCP (OpenCASCADE) is not available here — geometry tests skip automatically.
        # All non-OCP tests (materials, catalog, spec validation, sandbox, similarity) run.
        run: python -m pytest tests/ -v --tb=short
