name: Evaluate PR

on:
  pull_request:
    paths:
      - "agents/**"

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed agent
        id: agent
        run: |
          AGENT=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep '^agents/.*/agent\.py$' | head -1)
          if [ -z "$AGENT" ]; then
            echo "No agent.py changed — skipping eval."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "path=$AGENT" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build eval image
        if: steps.agent.outputs.found == 'true'
        run: docker build -t forge-eval .

      - name: Run evaluation (3× determinism check)
        id: eval
        if: steps.agent.outputs.found == 'true'
        run: |
          RESULTS=""
          FINAL=""
          for i in 1 2 3; do
            # Capture stdout; allow non-zero exit so we can surface the JSON error.
            # --json-compact produces a single-line JSON for safe shell handling.
            OUT=$(docker run --rm \
              -v "${{ github.workspace }}:/forge" \
              forge-eval \
              --agent /forge/${{ steps.agent.outputs.path }} \
              --spec /forge/specs/001_bracket.json \
              --json-compact 2>/dev/null) || true
            echo "Run $i: $OUT"
            SCORE=$(echo "$OUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('score','null'))" 2>/dev/null || echo "null")
            RESULTS="$RESULTS $SCORE"
            FINAL="$OUT"
          done

          # Check determinism: all three scores must match
          UNIQUE=$(echo $RESULTS | tr ' ' '\n' | grep -v '^$' | sort -u | wc -l)
          if [ "$UNIQUE" -gt 1 ]; then
            echo "FAIL: non-deterministic results: $RESULTS" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Write single-line JSON to GITHUB_OUTPUT
          echo "result=$FINAL" >> "$GITHUB_OUTPUT"

      - name: Load current SOTA
        id: sota
        if: steps.agent.outputs.found == 'true'
        run: |
          SOTA=$(cat sota/score.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('score_grams', 9999))")
          echo "mass=$SOTA" >> "$GITHUB_OUTPUT"

      - name: Post score comment
        if: steps.agent.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const result = JSON.parse('${{ steps.eval.outputs.result }}');
            const sota = parseFloat('${{ steps.sota.outputs.mass }}');
            const agent = '${{ steps.agent.outputs.path }}';

            let body;
            if (!result.passed) {
              body = `## Forge Eval — FAILED ❌\n\n` +
                `**Stage:** \`${result.stage}\`\n` +
                `**Reason:** ${result.reason}\n\n` +
                `Fix the issue and push again. See [docs/scoring.md](docs/scoring.md).`;
            } else {
              const score = result.score.toFixed(2);
              const beats = result.score < sota;
              const delta = (sota - result.score).toFixed(2);
              const stressRatio = (result.fea_stress_mpa / result.fea_allowable_mpa * 100).toFixed(1);

              body = `## Forge Eval — ${beats ? 'NEW LEADER 🏆' : 'PASSED ✅'}\n\n` +
                `| Metric | Value |\n|---|---|\n` +
                `| Mass | **${score} g** |\n` +
                `| Current SOTA | ${sota} g |\n` +
                `| Delta | ${beats ? '-' : '+'}${Math.abs(delta)} g |\n` +
                `| FEA stress | ${result.fea_stress_mpa.toFixed(1)} / ${result.fea_allowable_mpa.toFixed(1)} MPa (${stressRatio}%) |\n` +
                `| Agent time | ${result.elapsed_seconds.toFixed(1)}s |\n\n` +
                (beats
                  ? `**Beats the current SOTA by ${delta} g.** A maintainer will review and merge.`
                  : `Passes all constraints but does not beat the current SOTA (${sota} g). Keep optimizing.`);
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
