name: Evaluate PR

on:
  pull_request:
    paths:
      - "agents/**"

# Cancel any in-progress eval for the same PR branch when a new push arrives.
# Prevents CI queue pile-up when a miner pushes multiple commits in quick succession.
concurrency:
  group: eval-${{ github.head_ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed agent
        id: agent
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep '^agents/.*/agent\.py$' | grep -v '^agents/template/')

          if [ -z "$CHANGED" ]; then
            echo "No agent.py changed — skipping eval."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Block PRs that touch multiple agent directories — prevents one miner
          # from silently overwriting another miner's agent on merge.
          DIRS=$(echo "$CHANGED" | sed 's|/agent\.py||' | sort -u)
          DIR_COUNT=$(echo "$DIRS" | wc -l)
          if [ "$DIR_COUNT" -gt "1" ]; then
            echo "ERROR: PR modifies agent.py in multiple directories:" >&2
            echo "$DIRS" >&2
            echo "Each PR must touch exactly one agent directory." >&2
            exit 1
          fi

          AGENT=$(echo "$CHANGED" | head -1)
          echo "path=$AGENT" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Check source similarity against reference agents
        id: similarity
        if: steps.agent.outputs.found == 'true'
        run: |
          python3 scripts/check_source_similarity.py --agent "${{ steps.agent.outputs.path }}"

      - name: Select eval specs (one easy spec per active round)
        id: specs
        if: steps.agent.outputs.found == 'true' && steps.similarity.outcome == 'success'
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: python3 scripts/select_eval_specs.py

      - name: Check for duplicate submissions
        id: dedup
        if: steps.agent.outputs.found == 'true' && steps.similarity.outcome == 'success'
        env:
          FORGE_API_URL: ${{ secrets.FORGE_API_URL }}
          COMMIT_HASH: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$FORGE_API_URL" ]; then
            echo "cached=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          STATUS=$(curl -sf --max-time 10 -o /dev/null -w "%{http_code}" \
            "${FORGE_API_URL}/submissions?commit_hash=${COMMIT_HASH}&passed_only=false&limit=1" || echo "000")
          if [ "$STATUS" != "200" ]; then
            echo "forge-api unreachable ($STATUS) — proceeding with eval."
            echo "cached=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COUNT=$(curl -sf --max-time 10 \
            "${FORGE_API_URL}/submissions?commit_hash=${COMMIT_HASH}&passed_only=false&limit=1" \
            | python3 -c "import sys,json; print(len(json.load(sys.stdin)))" || echo "0")
          if [ "$COUNT" -gt "0" ]; then
            echo "Commit ${COMMIT_HASH} already scored — skipping eval."
            echo "cached=true" >> "$GITHUB_OUTPUT"
          else
            echo "cached=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.agent.outputs.found == 'true' && steps.similarity.outcome == 'success' && steps.dedup.outputs.cached != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build eval image
        if: steps.agent.outputs.found == 'true' && steps.similarity.outcome == 'success' && steps.dedup.outputs.cached != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: forge-eval:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify OCP in subprocess
        if: steps.agent.outputs.found == 'true' && steps.similarity.outcome == 'success' && steps.dedup.outputs.cached != 'true'
        run: |
          docker run --rm \
            --network none \
            --security-opt no-new-privileges \
            --memory 4g --cpus 2 \
            --entrypoint python3 \
            -v "${{ github.workspace }}:/forge" \
            forge-eval \
            /forge/scripts/test_ocp_subprocess.py

      - name: Run pool evaluation (3 specs, 2x determinism on first)
        id: eval
        if: steps.agent.outputs.found == 'true' && steps.similarity.outcome == 'success' && steps.dedup.outputs.cached != 'true'
        env:
          SPECS_JSON: ${{ steps.specs.outputs.json }}
          AGENT_PATH: ${{ steps.agent.outputs.path }}
          FORGE_LLM_KEY: ${{ secrets.FORGE_LLM_KEY || secrets.OPENROUTER_KEY }}
          FORGE_MODEL: ${{ secrets.FORGE_MODEL || 'anthropic/claude-haiku-4-5' }}
          FORGE_MODEL_WHITELIST: ${{ vars.FORGE_MODEL_WHITELIST || 'anthropic/claude-haiku-4-5,anthropic/claude-3-5-haiku,openai/gpt-4o-mini' }}
        run: python3 scripts/run_eval_pool.py

      - name: Post cross-category score comment
        id: post_comment
        if: steps.agent.outputs.found == 'true' && steps.similarity.outcome == 'success' && steps.dedup.outputs.cached != 'true'
        env:
          EVAL_RESULTS: ${{ steps.eval.outputs.results }}
          AGENT_PATH: ${{ steps.agent.outputs.path }}
          FORGE_API_URL: ${{ secrets.FORGE_API_URL }}
        uses: actions/github-script@v7
        with:
          script: |
            const results = JSON.parse(process.env.EVAL_RESULTS);
            const apiUrl = process.env.FORGE_API_URL || '';

            const METRIC_LABEL = {
              mass_grams: 'Mass',
              stiffness_to_weight: 'Stiffness/Weight',
              deflection_mm: 'Deflection',
            };
            const METRIC_UNIT = {
              mass_grams: 'g',
              stiffness_to_weight: 'N/(mm\u00b7g)',
              deflection_mm: 'mm',
            };
            const ROUND_NAME = {
              round_001: 'Mass Optimization \u2193',
              round_002: 'Stiffness/Weight \u2191',
              round_003: 'Absolute Stiffness \u2193',
            };

            // Fetch live SOTA + eligibility for each spec.
            // sotaBySpec[id]: { score: number, eligible: boolean } | 'unclaimed' | null (API down)
            // We check the eligibility endpoint with the actual eval score to enforce the
            // marginal-gain rule (1% improvement required for 0–7 day old SOTAs, etc.).
            const sotaBySpec = {};
            let apiReachable = !apiUrl; // treat "no URL configured" as reachable-but-empty
            for (const r of results) {
              if (!apiUrl) break;
              try {
                // Fetch current SOTA score
                const sotaResp = await fetch(`${apiUrl}/sota/${r.spec_id}`).catch(() => null);
                if (sotaResp && sotaResp.status === 404) {
                  apiReachable = true;
                  sotaBySpec[r.spec_id] = 'unclaimed';
                } else if (sotaResp && sotaResp.ok) {
                  apiReachable = true;
                  const d = await sotaResp.json();
                  const currentScore = d.score ?? d.score_grams ?? null;
                  // Check marginal-gain eligibility with the eval score
                  const evalScore = r.result?.score;
                  let eligible = false;
                  if (evalScore !== null && evalScore !== undefined) {
                    const elResp = await fetch(
                      `${apiUrl}/sota/${r.spec_id}/eligibility?score=${evalScore}`
                    ).catch(() => null);
                    if (elResp && elResp.ok) {
                      const el = await elResp.json();
                      eligible = el.eligible === true;
                    }
                  }
                  sotaBySpec[r.spec_id] = { score: currentScore, eligible };
                }
              } catch {}
            }

            const allPassed = results.every(r => r.result.passed);
            let anyBeatsSota = false;
            let compositeNorm = 0;
            let compositeCount = 0;

            const fmt = (v, metric) => {
              if (metric === 'mass_grams') return v.toFixed(2);
              if (metric === 'deflection_mm') return v.toFixed(4);
              return v.toFixed(4);
            };

            let rows = '';
            for (const r of results) {
              const res = r.result;
              const unit = METRIC_UNIT[r.metric] || '';
              const rname = ROUND_NAME[r.round_id] || r.round_id;
              const score = res.score;  // null when eval failed
              const baseline = r.baseline;
              // sotaBySpec[id]: { score, eligible } | 'unclaimed' | undefined (API was down)
              const sotaData = sotaBySpec[r.spec_id];
              const sotaKnown = sotaData !== undefined;
              const dir = r.direction;
              const icon = res.passed ? '\u2705' : '\u274c';

              if (!res.passed || score === null) {
                // Failed eval — show reason, skip numeric cells
                const reason = (res.reason || 'eval failed').slice(0, 80);
                compositeNorm += 999;
                compositeCount++;
                rows += `| ${icon} ${rname} | \`${r.spec_id}\` | \u2014 | ${fmt(baseline, r.metric)} ${unit} | \u2014 | \u274c ${reason} |\n`;
                continue;
              }

              // Normalized: lower is always better
              const norm = dir === 'maximize'
                ? (score > 0 ? baseline / score : 999)
                : (baseline > 0 ? score / baseline : 0);
              compositeNorm += norm;
              compositeCount++;

              const pct = dir === 'maximize'
                ? (score / baseline - 1) * 100
                : (baseline - score) / baseline * 100;
              const vsBaseline = (pct >= 0 ? '+' : '') + pct.toFixed(1) + '%';

              let sotaCell = '\u2014';
              if (!apiReachable || !sotaKnown) {
                // API was down — can't determine SOTA status; don't guess
                sotaCell = '\u2014 (API unreachable)';
              } else if (sotaData === 'unclaimed') {
                // No existing SOTA — any passing submission sets it
                anyBeatsSota = true;
                sotaCell = '\u2b50 unclaimed \u2014 sets new SOTA';
              } else if (sotaData && sotaData.eligible) {
                // Beats current SOTA with sufficient margin (marginal-gain rule satisfied)
                anyBeatsSota = true;
                sotaCell = `\u2713 beats ${fmt(sotaData.score, r.metric)} ${unit} (margin ok)`;
              } else if (sotaData && sotaData.score !== null) {
                const beats = dir === 'maximize' ? score > sotaData.score : score < sotaData.score;
                if (beats) {
                  // Beats raw score but margin threshold not met
                  sotaCell = `\u26a0\ufe0f beats ${fmt(sotaData.score, r.metric)} ${unit} — margin too small`;
                } else {
                  sotaCell = `${fmt(sotaData.score, r.metric)} ${unit}`;
                }
              }

              rows += `| ${icon} ${rname} | \`${r.spec_id}\` | **${fmt(score, r.metric)} ${unit}** | ${fmt(baseline, r.metric)} ${unit} | ${vsBaseline} | ${sotaCell} |\n`;
            }

            const composite = allPassed && compositeCount
              ? (compositeNorm / compositeCount * 100).toFixed(1)
              : '\u2014';

            const heading = !allPassed   ? 'FAILED \u274c'
                          : anyBeatsSota ? 'NEW LEADER \ud83c\udfc6'
                          :                'PASSED \u2705';

            const footer = !allPassed
              ? 'One or more categories failed. Fix the issues and push again. See [docs/scoring.md](docs/scoring.md).'
              : anyBeatsSota
              ? 'Beats SOTA in at least one category with sufficient margin. A maintainer will review and merge.'
              : 'Passes all three categories but does not beat the current SOTA. Keep optimizing.';

            const body =
              `## Forge Eval \u2014 ${heading}\n\n` +
              `### Cross-Category Results\n\n` +
              `| Status | Category | Score | Baseline | vs Baseline | Current SOTA |\n` +
              `|---|---|---|---|---|---|\n` +
              rows + `\n` +
              `**Composite score: ${composite}%** of baseline across all 3 categories ` +
              `(lower = better; maximize metrics are inverted for uniform comparison)\n\n` +
              footer;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

            core.setOutput('beats_sota', anyBeatsSota ? 'true' : 'false');
            core.setOutput('passed', allPassed ? 'true' : 'false');

      - name: Apply Gittensor scoring label
        if: steps.agent.outputs.found == 'true' && steps.similarity.outcome == 'success' && steps.dedup.outputs.cached != 'true'
        env:
          BEATS_SOTA: ${{ steps.post_comment.outputs.beats_sota }}
          PASSED: ${{ steps.post_comment.outputs.passed }}
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'optimization', color: '6366f1', description: 'PR beats SOTA in at least one category' },
              { name: 'passed',       color: '10b981', description: 'PR passes all three eval categories' },
            ];
            for (const l of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner, repo: context.repo.repo, name: l.name,
                });
              } catch {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner, repo: context.repo.repo, ...l,
                });
              }
            }
            const label = process.env.BEATS_SOTA === 'true' ? 'optimization'
                        : process.env.PASSED   === 'true' ? 'passed'
                        : null;
            if (label) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [label],
              });
            }

      - name: Record submissions to forge-api
        if: steps.agent.outputs.found == 'true' && steps.similarity.outcome == 'success' && steps.dedup.outputs.cached != 'true'
        env:
          FORGE_API_URL: ${{ secrets.FORGE_API_URL }}
          EVAL_RESULTS: ${{ steps.eval.outputs.results }}
          AGENT_PATH: ${{ steps.agent.outputs.path }}
          CONTRIBUTOR: ${{ github.event.pull_request.user.login }}
          COMMIT_HASH: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.number }}
        run: python3 scripts/record_submissions.py
