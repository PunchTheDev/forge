name: Evaluate PR

on:
  pull_request:
    paths:
      - "agents/**"

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed agent
        id: agent
        run: |
          AGENT=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep '^agents/.*/agent\.py$' | head -1)
          if [ -z "$AGENT" ]; then
            echo "No agent.py changed — skipping eval."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "path=$AGENT" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check duplicate submission
        id: dedup
        if: steps.agent.outputs.found == 'true'
        env:
          FORGE_API_URL: ${{ secrets.FORGE_API_URL }}
          COMMIT_HASH: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$FORGE_API_URL" ]; then
            echo "cached=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${FORGE_API_URL}/submissions?commit_hash=${COMMIT_HASH}&passed_only=false&limit=1")
          if [ "$STATUS" != "200" ]; then
            echo "forge-api unreachable ($STATUS) — proceeding with eval."
            echo "cached=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COUNT=$(curl -s \
            "${FORGE_API_URL}/submissions?commit_hash=${COMMIT_HASH}&passed_only=false&limit=1" \
            | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
          if [ "$COUNT" -gt "0" ]; then
            echo "Commit ${COMMIT_HASH} already scored — skipping eval."
            echo "cached=true" >> "$GITHUB_OUTPUT"
          else
            echo "cached=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build eval image
        if: steps.agent.outputs.found == 'true' && steps.dedup.outputs.cached != 'true'
        run: docker build -t forge-eval .

      - name: Run evaluation (3× determinism check)
        id: eval
        if: steps.agent.outputs.found == 'true' && steps.dedup.outputs.cached != 'true'
        run: |
          RESULTS=""
          FINAL=""
          for i in 1 2 3; do
            # Capture stdout; allow non-zero exit so we can surface the JSON error.
            # --json-compact produces a single-line JSON for safe shell handling.
            # On the final run, also write the STEP file out to the workspace.
            STEP_FLAG=""
            if [ "$i" = "3" ]; then
              STEP_FLAG="--step-out /forge/.forge_step_output.step"
            fi
            OUT=$(docker run --rm \
              --network none \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              --memory 4g \
              --cpus 2 \
              -v "${{ github.workspace }}:/forge" \
              forge-eval \
              --agent /forge/${{ steps.agent.outputs.path }} \
              --spec /forge/specs/001_bracket.json \
              --json-compact $STEP_FLAG 2>/dev/null) || true
            echo "Run $i: $OUT"
            SCORE=$(echo "$OUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('score','null'))" 2>/dev/null || echo "null")
            RESULTS="$RESULTS $SCORE"
            FINAL="$OUT"
          done

          # Check determinism: all three scores must match
          UNIQUE=$(echo $RESULTS | tr ' ' '\n' | grep -v '^$' | sort -u | wc -l)
          if [ "$UNIQUE" -gt 1 ]; then
            echo "FAIL: non-deterministic results: $RESULTS" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Write single-line JSON to GITHUB_OUTPUT
          echo "result=$FINAL" >> "$GITHUB_OUTPUT"

      - name: Load current SOTA
        id: sota
        if: steps.agent.outputs.found == 'true' && steps.dedup.outputs.cached != 'true'
        run: |
          SOTA=$(cat sota/score.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('score_grams', 9999))")
          echo "mass=$SOTA" >> "$GITHUB_OUTPUT"

      - name: Post score comment
        if: steps.agent.outputs.found == 'true' && steps.dedup.outputs.cached != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const result = JSON.parse('${{ steps.eval.outputs.result }}');
            const sota = parseFloat('${{ steps.sota.outputs.mass }}');
            const agent = '${{ steps.agent.outputs.path }}';

            let body;
            if (!result.passed) {
              body = `## Forge Eval — FAILED ❌\n\n` +
                `**Stage:** \`${result.stage}\`\n` +
                `**Reason:** ${result.reason}\n\n` +
                `Fix the issue and push again. See [docs/scoring.md](docs/scoring.md).`;
            } else {
              const score = result.score.toFixed(2);
              const beats = result.score < sota;
              const delta = (sota - result.score).toFixed(2);
              const stressRatio = (result.fea_stress_mpa / result.fea_allowable_mpa * 100).toFixed(1);

              body = `## Forge Eval — ${beats ? 'NEW LEADER 🏆' : 'PASSED ✅'}\n\n` +
                `| Metric | Value |\n|---|---|\n` +
                `| Mass | **${score} g** |\n` +
                `| Current SOTA | ${sota} g |\n` +
                `| Delta | ${beats ? '-' : '+'}${Math.abs(delta)} g |\n` +
                `| FEA stress | ${result.fea_stress_mpa.toFixed(1)} / ${result.fea_allowable_mpa.toFixed(1)} MPa (${stressRatio}%) |\n` +
                `| Agent time | ${result.elapsed_seconds.toFixed(1)}s |\n\n` +
                (beats
                  ? `**Beats the current SOTA by ${delta} g.** A maintainer will review and merge.`
                  : `Passes all constraints but does not beat the current SOTA (${sota} g). Keep optimizing.`);
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Record submission to forge-api
        if: steps.agent.outputs.found == 'true' && steps.dedup.outputs.cached != 'true'
        env:
          FORGE_API_URL: ${{ secrets.FORGE_API_URL }}
          EVAL_RESULT: ${{ steps.eval.outputs.result }}
          AGENT_PATH: ${{ steps.agent.outputs.path }}
          CONTRIBUTOR: ${{ github.event.pull_request.user.login }}
          COMMIT_HASH: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          python3 - <<'PYEOF'
import base64, json, os, urllib.request, urllib.error
from pathlib import Path

url_base = os.environ.get("FORGE_API_URL", "").strip()
if not url_base:
    print("FORGE_API_URL not set — skipping submission record.")
    raise SystemExit(0)

result = json.loads(os.environ["EVAL_RESULT"])

step_b64 = None
step_file = Path(".forge_step_output.step")
if step_file.exists():
    step_b64 = base64.b64encode(step_file.read_bytes()).decode()
    step_file.unlink(missing_ok=True)

payload = {
    "spec_id": "001_bracket",
    "agent_path": os.environ["AGENT_PATH"],
    "contributor": os.environ["CONTRIBUTOR"],
    "commit_hash": os.environ["COMMIT_HASH"],
    "mass_grams": result.get("score") or 0.0,
    "fea_stress_mpa": result.get("fea_stress_mpa") or 0.0,
    "fea_allowable_mpa": result.get("fea_allowable_mpa") or 0.0,
    "passed": bool(result.get("passed", False)),
    "pr_number": int(os.environ["PR_NUMBER"]),
    "notes": f"CI eval — PR #{os.environ['PR_NUMBER']}",
    "step_b64": step_b64,
}
body = json.dumps(payload).encode()
url = url_base.rstrip("/") + "/submissions"
req = urllib.request.Request(url, data=body, headers={"Content-Type": "application/json"}, method="POST")
try:
    with urllib.request.urlopen(req, timeout=15) as resp:
        print(f"Submission recorded: {resp.read().decode()[:120]}")
except urllib.error.URLError as e:
    print(f"forge-api POST failed (non-blocking): {e}", flush=True)
PYEOF
