name: Evaluate PR

on:
  pull_request:
    paths:
      - "agents/**"

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed agent
        id: agent
        run: |
          AGENT=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep '^agents/.*/agent\.py$' | grep -v '^agents/template/' | head -1)
          if [ -z "$AGENT" ]; then
            echo "No agent.py changed — skipping eval."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "path=$AGENT" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
            # Detect target spec: read agent_dir/spec.txt if present; else default.
            AGENT_DIR=$(dirname "$AGENT")
            SPEC_ID="001_bracket"
            if [ -f "${AGENT_DIR}/spec.txt" ]; then
              SPEC_ID=$(cat "${AGENT_DIR}/spec.txt" | tr -d '[:space:]')
            fi
            echo "spec_id=$SPEC_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Check duplicate submission
        id: dedup
        if: steps.agent.outputs.found == 'true'
        env:
          FORGE_API_URL: ${{ secrets.FORGE_API_URL }}
          COMMIT_HASH: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$FORGE_API_URL" ]; then
            echo "cached=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          STATUS=$(curl -sf --max-time 10 -o /dev/null -w "%{http_code}" \
            "${FORGE_API_URL}/submissions?commit_hash=${COMMIT_HASH}&passed_only=false&limit=1" || echo "000")
          if [ "$STATUS" != "200" ]; then
            echo "forge-api unreachable ($STATUS) — proceeding with eval."
            echo "cached=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COUNT=$(curl -sf --max-time 10 \
            "${FORGE_API_URL}/submissions?commit_hash=${COMMIT_HASH}&passed_only=false&limit=1" \
            | python3 -c "import sys,json; print(len(json.load(sys.stdin)))" || echo "0")
          if [ "$COUNT" -gt "0" ]; then
            echo "Commit ${COMMIT_HASH} already scored — skipping eval."
            echo "cached=true" >> "$GITHUB_OUTPUT"
          else
            echo "cached=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build eval image
        if: steps.agent.outputs.found == 'true' && steps.dedup.outputs.cached != 'true'
        run: docker build -t forge-eval .

      - name: Verify OCP in subprocess
        if: steps.agent.outputs.found == 'true' && steps.dedup.outputs.cached != 'true'
        run: |
          docker run --rm \
            --network none \
            --security-opt no-new-privileges \
            --memory 4g --cpus 2 \
            --entrypoint python3 \
            -v "${{ github.workspace }}:/forge" \
            forge-eval \
            /forge/scripts/test_ocp_subprocess.py

      - name: Run evaluation (3× determinism check)
        id: eval
        if: steps.agent.outputs.found == 'true' && steps.dedup.outputs.cached != 'true'
        run: |
          RESULTS=""
          FINAL=""
          # Pass the SOTA reference STEP for similarity check if it exists.
          REF_FLAG=""
          if [ -f "sota/reference.step" ]; then
            REF_FLAG="--reference-step /forge/sota/reference.step"
          fi

          for i in 1 2 3; do
            # Capture stdout; allow non-zero exit so we can surface the JSON error.
            # --json-compact produces a single-line JSON for safe shell handling.
            # On the final run, also write the STEP file out to the workspace.
            STEP_FLAG=""
            if [ "$i" = "3" ]; then
              STEP_FLAG="--step-out /forge/.forge_step_output.step"
            fi
            OUT=$(docker run --rm \
              --security-opt no-new-privileges \
              --memory 4g \
              --cpus 2 \
              -e FORGE_LLM_KEY=${{ secrets.FORGE_LLM_KEY || secrets.OPENROUTER_KEY }} \
              -e FORGE_MODEL=${{ secrets.FORGE_MODEL || 'anthropic/claude-haiku-4-5' }} \
              -e FORGE_MODEL_WHITELIST=${{ vars.FORGE_MODEL_WHITELIST || 'anthropic/claude-haiku-4-5,anthropic/claude-3-5-haiku,openai/gpt-4o-mini' }} \
              -v "${{ github.workspace }}:/forge" \
              forge-eval \
              --agent /forge/${{ steps.agent.outputs.path }} \
              --spec /forge/specs/${{ steps.agent.outputs.spec_id }}.json \
              --json-compact $STEP_FLAG $REF_FLAG 2>/dev/null) || true
            echo "Run $i: $OUT"
            SCORE=$(echo "$OUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('score','null'))" 2>/dev/null || echo "null")
            RESULTS="$RESULTS $SCORE"
            FINAL="$OUT"
          done

          # Check determinism: all three scores must match
          UNIQUE=$(echo $RESULTS | tr ' ' '\n' | grep -v '^$' | sort -u | wc -l)
          if [ "$UNIQUE" -gt 1 ]; then
            echo "FAIL: non-deterministic results: $RESULTS" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Check FEA passed: null scores mean FEA or geometry failure
          PASSED=$(echo "$FINAL" | python3 -c "import sys,json; print(json.load(sys.stdin).get('passed', False))" 2>/dev/null || echo "False")
          if [ "$PASSED" != "True" ]; then
            echo "FAIL: eval did not pass: $(echo $FINAL | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('reason','unknown'))" 2>/dev/null)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Write single-line JSON to GITHUB_OUTPUT
          echo "result=$FINAL" >> "$GITHUB_OUTPUT"

      - name: Load current SOTA
        id: sota
        if: steps.agent.outputs.found == 'true' && steps.dedup.outputs.cached != 'true'
        env:
          FORGE_API_URL: ${{ secrets.FORGE_API_URL }}
        run: |
          # Prefer live forge-api SOTA (reflects verified + estimated scores);
          # fall back to sota/score.json if the API is unreachable.
          SPEC_ID="${{ steps.agent.outputs.spec_id }}"
          SOTA=9999
          if [ -n "$FORGE_API_URL" ]; then
            API_SOTA=$(curl -sf --max-time 10 "${FORGE_API_URL}/sota/${SPEC_ID}" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('score') or d.get('score_grams', 9999))" 2>/dev/null || echo "")
            if [ -n "$API_SOTA" ] && [ "$API_SOTA" != "9999" ]; then
              SOTA="$API_SOTA"
            fi
          fi
          # Fallback: sota/score.json only exists for spec 001.
          if [ "$SOTA" = "9999" ] && [ "$SPEC_ID" = "001_bracket" ]; then
            SOTA=$(python3 -c "import json; print(json.load(open('sota/score.json')).get('score_grams', 9999))")
          fi
          echo "score=$SOTA" >> "$GITHUB_OUTPUT"

      - name: Post score comment
        if: steps.agent.outputs.found == 'true' && steps.dedup.outputs.cached != 'true'
        env:
          EVAL_RESULT: ${{ steps.eval.outputs.result }}
          SOTA_SCORE: ${{ steps.sota.outputs.score }}
          AGENT_PATH: ${{ steps.agent.outputs.path }}
        uses: actions/github-script@v7
        with:
          script: |
            const result = JSON.parse(process.env.EVAL_RESULT);
            const sota = parseFloat(process.env.SOTA_SCORE);
            const agent = process.env.AGENT_PATH;
            const metric = result.score_metric || 'mass_grams';
            const direction = result.score_direction || 'minimize';

            let body;
            if (!result.passed) {
              body = `## Forge Eval — FAILED ❌\n\n` +
                `**Stage:** \`${result.stage}\`\n` +
                `**Reason:** ${result.reason}\n\n` +
                `Fix the issue and push again. See [docs/scoring.md](docs/scoring.md).`;
            } else {
              const scoreVal = result.score;
              const scoreStr = metric === 'mass_grams' || metric === 'volume_mm3'
                ? scoreVal.toFixed(2)
                : scoreVal.toFixed(4);
              const metricLabel = {
                mass_grams: 'Mass',
                volume_mm3: 'Volume',
                stiffness_to_weight: 'Stiffness/Weight',
              }[metric] || metric;
              const metricUnit = {
                mass_grams: 'g',
                volume_mm3: 'mm³',
                stiffness_to_weight: 'N/(mm·g)',
              }[metric] || '';

              // "beats" depends on direction: minimize → lower is better; maximize → higher
              const beats = direction === 'maximize'
                ? scoreVal > sota
                : scoreVal < sota;
              const delta = Math.abs(sota - scoreVal);
              const deltaStr = delta.toFixed(metric === 'stiffness_to_weight' ? 4 : 2);
              const stressRatio = (result.fea_stress_mpa / result.fea_allowable_mpa * 100).toFixed(1);
              const simStr = result.similarity != null
                ? `| Similarity to SOTA | ${(result.similarity * 100).toFixed(1)}% |\n`
                : '';
              const dispStr = result.fea_displacement_mm != null
                ? `| FEA displacement | ${result.fea_displacement_mm.toFixed(4)} mm |\n`
                : '';

              body = `## Forge Eval — ${beats ? 'NEW LEADER 🏆' : 'PASSED ✅'}\n\n` +
                `| Metric | Value |\n|---|---|\n` +
                `| ${metricLabel} | **${scoreStr} ${metricUnit}** |\n` +
                `| Current SOTA | ${sota} ${metricUnit} |\n` +
                `| Delta | ${beats ? (direction === 'maximize' ? '+' : '-') : (direction === 'maximize' ? '-' : '+')}${deltaStr} ${metricUnit} |\n` +
                `| FEA stress | ${result.fea_stress_mpa.toFixed(1)} / ${result.fea_allowable_mpa.toFixed(1)} MPa (${stressRatio}%) |\n` +
                dispStr +
                simStr +
                `| Agent time | ${result.elapsed_seconds.toFixed(1)}s |\n\n` +
                (beats
                  ? `**Beats the current SOTA.** A maintainer will review and merge.`
                  : `Passes all constraints but does not beat the current SOTA. Keep optimizing.`);
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Record submission to forge-api
        if: steps.agent.outputs.found == 'true' && steps.dedup.outputs.cached != 'true'
        env:
          FORGE_API_URL: ${{ secrets.FORGE_API_URL }}
          EVAL_RESULT: ${{ steps.eval.outputs.result }}
          AGENT_PATH: ${{ steps.agent.outputs.path }}
          SPEC_ID: ${{ steps.agent.outputs.spec_id }}
          CONTRIBUTOR: ${{ github.event.pull_request.user.login }}
          COMMIT_HASH: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.number }}
        run: python3 scripts/record_submission.py
